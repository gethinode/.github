# Source: https://nicolasiensen.github.io/2022-07-23-automating-dependency-updates-with-dependabot-github-auto-merge-and-github-actions/
name: PR auto-merge
on:
  workflow_call:
    secrets:
      AUTOMERGE_APP_PRIVATE_KEY:
        description: Private key for the calling repository's auto-merge GitHub App.
        required: false

permissions:
  pull-requests: write
  contents: write

jobs:
  review-dependabot-pr:
    runs-on: ubuntu-latest
    concurrency:
      group: dependabot-auto-merge-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    if: ${{ github.event.pull_request.user.login == 'dependabot[bot]' }}
    steps:
      - name: Dependabot metadata
        id: metadata
        continue-on-error: true
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3
        with:
          github-token: "${{ secrets.GITHUB_TOKEN }}"

      - name: Verify auto-merge eligibility for this pull request head
        id: auto-merge-eligibility
        if: ${{ steps.metadata.outcome == 'success' && (steps.metadata.outputs.update-type == 'version-update:semver-patch' || steps.metadata.outputs.update-type == 'version-update:semver-minor') }}
        shell: bash
        env:
          UPDATED_DEPENDENCIES: ${{ steps.metadata.outputs.updated-dependencies-json }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ! jq --slurp --exit-status '
            length == 1 and (.[0] | type == "array" and length > 0 and all(.[];
              .updateType == "version-update:semver-patch" or
              .updateType == "version-update:semver-minor"
            ))
          ' <<< "$UPDATED_DEPENDENCIES" > /dev/null; then
            echo 'reason=At least one dependency could not be verified as a patch or minor update.' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # fetch-metadata classifies only the first commit, including for grouped updates.
          if ! gh api "repos/$REPO/pulls/$PR_NUMBER/commits?per_page=2" |
              jq --exit-status --arg head "$HEAD_SHA" '
                type == "array" and length == 1 and (.[0] |
                  .sha == $head and
                  .author.login == "dependabot[bot]" and
                  .committer.login == "web-flow" and
                  .commit.verification.verified == true and
                  (.parents | type == "array" and length == 1))
              ' > /dev/null; then
            echo 'reason=The PR head is not a single verified Dependabot commit.' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo 'eligible=true' >> "$GITHUB_OUTPUT"

      - name: Mint the repository-scoped auto-merge App token
        id: app-token
        if: ${{ steps.auto-merge-eligibility.outputs.eligible == 'true' && vars.AUTOMERGE_APP_CLIENT_ID != '' && vars.AUTOMERGE_APP_SLUG != '' }}
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          client-id: ${{ vars.AUTOMERGE_APP_CLIENT_ID }}
          private-key: ${{ secrets.AUTOMERGE_APP_PRIVATE_KEY }}
          repositories: ${{ github.repository }}
          permission-contents: write
          permission-pull-requests: write
          permission-workflows: write

      - name: Reconcile Dependabot auto-merge state
        id: auto-merge-state
        if: ${{ !cancelled() }}
        shell: bash
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REASON: ${{ steps.auto-merge-eligibility.outputs.reason }}
          UPDATE_TYPE: ${{ steps.metadata.outputs.update-type }}
          ELIGIBLE: ${{ steps.auto-merge-eligibility.outputs.eligible }}
          APP_SLUG: ${{ vars.AUTOMERGE_APP_SLUG }}
          MINTED_APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
          APP_TOKEN_READY: ${{ steps.app-token.outcome == 'success' && steps.app-token.outputs.token != '' }}
        run: |
          # shellcheck disable=SC2016 # Variables are bound by GraphQL.
          query='query($owner: String!, $name: String!, $number: Int!) {
            repository(owner: $owner, name: $name) {
              pullRequest(number: $number) {
                state headRefOid isInMergeQueue autoMergeRequest { enabledBy { __typename login } }
              }
            }
          }'
          read_pr() {
            gh api graphql -f query="$query" -f owner="${REPO%%/*}" -f name="${REPO#*/}" -F number="$PR_NUMBER" |
              jq -ce '.data.repository.pullRequest |
                select(type == "object" and (.headRefOid | type) == "string"
                  and (.isInMergeQueue | type) == "boolean"
                  and (.state == "OPEN" or .state == "CLOSED" or .state == "MERGED")
                  and has("autoMergeRequest"))'
          }

          should_arm=false
          configuration_error=''
          if [ "$ELIGIBLE" = true ]; then
            if [ "$APP_TOKEN_READY" = true ] && [ -n "$APP_SLUG" ] && [ "$MINTED_APP_SLUG" = "$APP_SLUG" ]; then
              should_arm=true
            else
              configuration_error='A token for the configured auto-merge App was unavailable.'
            fi
          fi

          disarm_error=''
          if ! pr=$(read_pr); then
            disarm_error='could not read the current pull request state'
          elif ! jq -e --arg head "$HEAD_SHA" '.state == "OPEN" and .headRefOid == $head' <<< "$pr" > /dev/null; then
            echo 'Skipping a closed pull request or a superseded event.'
            exit 0
          elif jq -e '.isInMergeQueue' <<< "$pr" > /dev/null; then
            if [ "$should_arm" = true ]; then
              echo 'The eligible pull request is already in the merge queue.'
              exit 0
            fi
            disarm_error='the pull request is already in the merge queue'
          elif jq -e '.autoMergeRequest != null' <<< "$pr" > /dev/null; then
            armer=$(jq -r '.autoMergeRequest.enabledBy | [.__typename // "", .login // ""] | join(":")' <<< "$pr")
            disarm=false
            case "$armer" in
              Bot:github-actions | 'Bot:github-actions[bot]' | Bot:app/github-actions)
                disarm=true
                ;;
              :* | *:) disarm_error='could not identify who enabled auto-merge' ;;
              "Bot:$APP_SLUG" | "Bot:${APP_SLUG}[bot]" | "Bot:app/$APP_SLUG")
                if [ "$should_arm" = true ]; then
                  echo 'Auto-merge is already enabled by the configured App.'
                  echo 'review=true' >> "$GITHUB_OUTPUT"
                  exit 0
                fi
                disarm=true
                ;;
              *)
                echo 'Auto-merge enabled outside this workflow remains in place.'
                if [ "$should_arm" = true ]; then exit 0; fi
                ;;
            esac
            if [ "$disarm" = true ]; then
              if gh pr merge --disable-auto "$PR_URL" && pr=$(read_pr) &&
                  jq -e '.autoMergeRequest == null and (.isInMergeQueue | not)' <<< "$pr" > /dev/null; then
                echo 'Workflow-owned auto-merge was disabled.'
                if ! jq -e --arg head "$HEAD_SHA" '.state == "OPEN" and .headRefOid == $head' <<< "$pr" > /dev/null; then
                  echo 'Skipping the rest of a closed pull request or a superseded event.'
                  exit 0
                fi
              else
                disarm_error='could not confirm that workflow-owned auto-merge was disabled'
              fi
            fi
          fi

          if [ "$should_arm" = true ] && [ -z "$disarm_error" ]; then
            printf '%s\n' 'ready=true' 'review=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ -n "$configuration_error" ]; then
            reason="$configuration_error"
          elif [ -n "$disarm_error" ]; then
            reason='Existing auto-merge could not be reconciled.'
          elif [ "$UPDATE_TYPE" = version-update:semver-major ]; then
            reason='Major dependency update.'
          else
            reason="${REASON:-Dependabot metadata did not establish auto-merge eligibility.}"
          fi
          if ! gh pr edit "$PR_URL" --add-label 'requires-manual-qa'; then
            echo '::warning::The requires-manual-qa label could not be applied.'
          fi
          gh pr comment "$PR_URL" --body "Manual QA required. $reason"
          if [ -n "$disarm_error" ]; then
            echo "::error::Auto-merge state requires manual attention: $disarm_error."
            exit 1
          fi
          if [ -n "$configuration_error" ]; then
            echo "::error::$configuration_error Set the App client ID, slug and private key for this repository."
            exit 1
          fi

      - name: Enable auto-merge for Dependabot PRs
        if: ${{ steps.auto-merge-state.outputs.ready == 'true' }}
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo '::error::The auto-merge App did not return an installation token.'
            exit 1
          fi
          gh pr merge --auto --merge --match-head-commit "$HEAD_SHA" "$PR_URL"

      - name: Approve patch and minor updates
        if: ${{ steps.auto-merge-state.outputs.review == 'true' }}
        run: |
          if ! gh api --silent "repos/$REPO/pulls/$PR_NUMBER/reviews" \
              -f commit_id="$HEAD_SHA" -f event=APPROVE \
              -f body='Verified patch or minor Dependabot update.'; then
            echo '::warning::GitHub Actions could not record its review.'
          fi
        env:
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  review-mod-update-pr:
    runs-on: ubuntu-latest
    if: ${{ github.event.pull_request.user.login != 'dependabot[bot]' && github.event.pull_request.title == 'Update Hugo module dependencies' }}
    steps:
      - name: Enable auto-merge for mod-update PRs
        run: gh pr merge --auto --merge "$PR_URL"
        env:
          PR_URL: ${{github.event.pull_request.html_url}}
          GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}
